name: Zber inzerátov

on:
  schedule:
    # Nepárna minúta a o hodinu skôr zámerne. Pri '0 3 * * *' štartovali behy
    # reálne až okolo 07:45 UTC — GitHub plánované behy odkladá a celá hodina
    # je najvyťaženejší čas. Aj keby meškanie ostalo, mapa je hotová skôr.
    - cron: '17 2 * * *'
    # topreality si v robots.txt pýta 6 s na request, takže beží raz týždenne
    - cron: '47 2 * * 0'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Zoznam zdrojov (prázdne = podľa rozvrhu)'
        required: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    # zápis kvôli vetve `data`; predvolene má token len čítanie
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Bez tokenu sa mapa nemá ako dostať na doménu. Kým mali kroky na
      # zostavenie a nasadenie len podmienku `if: env.VERCEL_TOKEN != ''`,
      # chýbajúci token ich ticho preskočil a beh sa nahlásil ako úspešný —
      # mapa by zamrzla a nikto by sa to nedozvedel. To je presne ten druh
      # tichého zlyhania, ktoré tu už raz stálo štyri dni.
      #
      # Kontrolujeme hneď na začiatku: nemá zmysel dve hodiny zaťažovať
      # portály zberom, ktorý sa aj tak nemá kam nasadiť.
      - name: Overiť token na Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Chýba secret VERCEL_TOKEN. Mapa by sa nenasadila a beh by to nezahlásil."
            exit 1
          fi

      # Databáza má 27 MB a do gitu nepatrí — každodenný commit by z histórie
      # spravil desiatky gigabajtov. Cache ju prenesie medzi behmi; ak vypadne,
      # crawl si ju naplní odznova, len to potrvá dlhšie.
      - name: Načítať databázu z cache
        uses: actions/cache/restore@v4
        with:
          path: data/listings.db
          key: listings-db-${{ github.run_id }}
          restore-keys: listings-db-

      - name: Vybrať zdroje
        id: pick
        run: |
          if [ -n "${{ inputs.sources }}" ]; then
            echo "sources=${{ inputs.sources }}" >> "$GITHUB_OUTPUT"
          # Pozor: musí sa zhodovať s týždenným cronom hore, znak po znaku.
          # Inak by nedeľa ticho zbierala rýchle zdroje a topreality by
          # nezbieral nikto.
          elif [ "${{ github.event.schedule }}" = "47 2 * * 0" ]; then
            echo "sources=topreality" >> "$GITHUB_OUTPUT"
          else
            echo "sources=nehnutelnosti,zoznamrealit,bazos" >> "$GITHUB_OUTPUT"
          fi

      # Testy pred zberom: pokazený parser nemá čo prepisovať databázu
      # ani nasadzovať mapu.
      - name: Testy
        run: npm test

      - name: Zber
        env:
          SCRAPE_USE_CACHE: '0'
          SCRAPE_DELAY_MS: '1500'
        run: npm run scrape -- --source "${{ steps.pick.outputs.sources }}" --limit 20000 --max-pages 90

      # Uložiť hneď po zbere a bez ohľadu na to, čo príde ďalej. Kým bola
      # databáza na `cache@v4`, jej záverečný krok sa pri páde behu nespustil
      # a odviedená práca sa zahodila — štyri noci zberu skončili v koši,
      # lebo padla až kontrola dát za ním.
      - name: Uložiť databázu do cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/listings.db
          key: listings-db-${{ github.run_id }}

      # Kontrola, či výsledok dáva zmysel. Testy overujú kód; toto overuje
      # dáta — teda to, čo sa pokazí, keď portál prekope HTML bez toho, aby
      # sme zmenili jediný riadok.
      - name: Kontrola dát
        run: npm run health -w @rmb/scraper

      - name: Statický export
        run: npm run export -w @rmb/scraper

      # Export ide na vetvu `data` s jediným commitom (force-push), takže
      # história repa nerastie o pol megabajtu denne. Slúži ako záloha
      # a na to, aby sa dalo pozrieť, čo posledný beh vyrobil.
      - name: Publikovať dáta
        run: |
          cd data/export
          git init -q
          git checkout -q -b data
          git config user.name "crawl bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Dáta $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      # Dáta idú priamo do buildu, nie na verejnú URL — repo tak môže ostať
      # súkromné a dataset nie je nikde samostatne stiahnuteľný.
      - name: Zostaviť mapu
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_DATA_URL: /data
        run: |
          mkdir -p packages/web/public
          cp -r data/export packages/web/public/data
          npm run build -w @rmb/web

      # Vercelu posielame hotový build cez Build Output API. Bez toho sa ho
      # snaží stavať sám: spustí `npm install` nad priečinkom s výsledkom
      # buildu, kde žiadny package.json nie je, a padne.
      #
      # `link --yes --project` je idempotentné: pri prvom behu projekt založí,
      # pri ďalších sa naň len napojí, takže netreba nič klikať dopredu.
      - name: Nasadiť na Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mkdir -p deploy/.vercel/output/static
          cp -r packages/web/dist/. deploy/.vercel/output/static/
          echo '{"version":3}' > deploy/.vercel/output/config.json

          cd deploy
          npx --yes vercel@latest link --yes \
            --project realitna-mapa-bratislava --token "$VERCEL_TOKEN"

          url=$(npx --yes vercel@latest deploy --prebuilt \
            --prod --yes --archive=tgz --token "$VERCEL_TOKEN")

          echo "Mapa nasadená: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Zhrnutie
        if: always()
        run: |
          {
            echo "### Zber: ${{ steps.pick.outputs.sources }}"
            echo ''
            echo '```'
            tail -12 data/logs/*.log 2>/dev/null || echo 'bez logu'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
